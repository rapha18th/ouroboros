[project]
name = "ouroboros"
version = "0.1.0"
description = "Beam's router as polygraph and scalpel"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ouroboros*"]
